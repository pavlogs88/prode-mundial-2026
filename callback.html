<!DOCTYPE html>
<html>
<head>
  <title>Iniciando sesión...</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<p>Iniciando sesión, espera un momento...</p>
<script>
  const SUPABASE_URL = 'https://okshrrfgxoqzqwrbdnku.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rc2hycmZneG9xenF3cmJkbmt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MjU3MzcsImV4cCI6MjA5NjAwMTczN30.LzAlKWOJCwcwAsm2HOpUNpKeCef1IobIy489Srb3g0E';
  const APP_URL = 'https://mundial2026-loschangos.streamlit.app/';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function handleCallback() {
    try {
      // Let Supabase JS SDK handle the PKCE exchange automatically
      const { data, error } = await supabase.auth.getSession();
      
      if (error) throw error;
      
      if (data.session) {
        const at = data.session.access_token;
        const rt = data.session.refresh_token || '';
        window.location.href = APP_URL + '?access_token=' + encodeURIComponent(at) + '&refresh_token=' + encodeURIComponent(rt);
      } else {
        // Try exchanging code manually if session not ready yet
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        if (code) {
          const { data: exchanged, error: exchError } = await supabase.auth.exchangeCodeForSession(code);
          if (exchError) throw exchError;
          const at = exchanged.session.access_token;
          const rt = exchanged.session.refresh_token || '';
          window.location.href = APP_URL + '?access_token=' + encodeURIComponent(at) + '&refresh_token=' + encodeURIComponent(rt);
        } else {
          document.body.innerHTML = '<p>Error: no se recibió código de autorización. <a href="' + APP_URL + '">Volver</a></p>';
        }
      }
    } catch (e) {
      document.body.innerHTML = '<p>Error: ' + e.message + '. <a href="' + APP_URL + '">Volver</a></p>';
    }
  }

  handleCallback();
</script>
</body>
</html>
