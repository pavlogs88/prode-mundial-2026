<!DOCTYPE html>
<html>
<head><title>Redirigiendo al Prode...</title></head>
<body>
    <p>Procesando autenticación con Google...</p>
    <script>
        console.log("Hash recibido:", window.location.hash);
        
        const hash = window.location.hash.substring(1);
        if (hash && hash.includes('access_token')) {
            const params = new URLSearchParams(hash);
            const access_token = params.get('access_token');
            const refresh_token = params.get('refresh_token') || '';
            
            if (access_token) {
                window.location.href = `https://mundial2026-loschangos.streamlit.app/?access_token=${encodeURIComponent(access_token)}&refresh_token=${encodeURIComponent(refresh_token)}`;
            } else {
                window.location.href = `https://mundial2026-loschangos.streamlit.app/?error=token_missing`;
            }
        } else {
            window.location.href = `https://mundial2026-loschangos.streamlit.app/?error=no_hash`;
        }
    </script>
</body>
</html>
